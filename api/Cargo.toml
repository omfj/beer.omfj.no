[package]
name = "beer-counter-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "migrate",
] }
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
] }
tower = "0.5"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
